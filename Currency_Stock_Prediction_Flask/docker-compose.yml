version: '4.29'

networks:
  default:

services:
  db:
    image: mysql:8.0.32
    container_name: currency_stock_db
    ports:
      - "3306:3306"
    volumes:
        - "./.data/db:/var/lib/mysql"
        - "./init:/docker-entrypoint-initdb.d"
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: currency_stock_db
    restart:
      always
