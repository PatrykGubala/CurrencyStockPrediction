version: '4.29'


services:
  db:
    image: mysql:8.0.32
    container_name: currency_stock_db
    ports:
      - "3306:3306"
    volumes:
        - "./.data/db:/var/lib/mysql"
        - "./init:/docker-entrypoint-initdb.d"
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: currency_stock_db
    restart:
      always




  redis:
    image: redis:7
    container_name: redis_server
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - redis_network

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped
networks:
  redis_network:
    driver: bridge



