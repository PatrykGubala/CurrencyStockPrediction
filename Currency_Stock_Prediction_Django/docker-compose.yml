version: '4.29'


services:
  web:
    image: python:3.12
    env_file:
      - .env
    container_name: django_app
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "
        pip install --no-cache-dir -r requirements.txt &&
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn Currency_Stock_Prediction_Django.wsgi:application --bind 0.0.0.0:8000
      "
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - redis_network

  celery_worker:
    image: python:3.12
    env_file:
      - .env
    container_name: celery_worker
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "
        pip install --no-cache-dir -r requirements.txt &&
        celery -A Currency_Stock_Prediction_Django worker -l info
      "
    depends_on:
      - web
      - redis
    networks:
      - redis_network

  celery_beat:
    image: python:3.12
    env_file:
      - .env
    container_name: celery_beat
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "
        pip install --no-cache-dir -r requirements.txt &&
        celery -A Currency_Stock_Prediction_Django beat --loglevel=info
      "
    depends_on:
      - web
      - redis
    networks:
      - redis_network

  db:
    image: mysql:8.0.32
    container_name: currency_stock_db
    ports:
      - "3306:3306"
    volumes:
      - "./.data/db:/var/lib/mysql"
      - "./init:/docker-entrypoint-initdb.d"
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: currency_stock_db

    networks:
      - redis_network

  redis:
    image: redis:7
    container_name: redis_server
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - redis_network

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

    networks:
      - redis_network

networks:
  redis_network:
    driver: bridge